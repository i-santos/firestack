name: Quality Gate

on:
  pull_request:
    branches:
      - develop
      - main

permissions:
  contents: read

jobs:
  quality-gate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Firestack CI contracts
        run: |
          npx firestack env --staging
          npx firestack test --ci --profile staging
